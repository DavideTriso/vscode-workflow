name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release (es. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: node esbuild.mjs --production

      - name: Package VSIX
        run: npx vsce package --no-dependencies -o "copilot-workflow-guide-${{ inputs.tag }}.vsix"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" "copilot-workflow-guide-${TAG}.vsix" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes
